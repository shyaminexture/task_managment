
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Task Management</h1>
    <p>Organize your day, one task at a time.</p>

    <form>
        <label for="task-input">New task</label>
        <input
            type="text"
            id="task-input"
            placeholder="Enter your task here"
        />
        <label for="task-priority">Priority</label>
    <select id="task-priority">
    <option value="low">Low</option>
    <option value="medium" selected>Medium</option>
    <option value="high">High</option>
    </select>
        <button type="submit">Add Task</button>
    </form>

    <section class="task-section">
    <h2>My Tasks</h2>

<div id="task-stats">
    <div class="stat-card">
        <h3>Total Tasks</h3>
        <p id="total-tasks">0</p>
    </div>

    <div class="stat-card"> 
        <h3>Active Tasks</h3>
        <p id="active-tasks">0</p>
    </div>

    <div class="stat-card">
        <h3>Completed Tasks</h3>
        <p id="completed-tasks">0</p>
    </div>

</div>

    <label for="search-input">Search tasks</label>
    <input
        type="text"
        id="search-input"
        placeholder="Search tasks..."
    />

    <div id="task-filters">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
</section>

    <script src="js/app.js"></script>
</body>
</html>
